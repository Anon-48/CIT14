<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML TextFormatting</title>
</head>
<body>
    <p>
            <strong><ins>HTML</ins></strong> stands for
            <em>HyperText Markup Language</em>.
        </p>
        </small>

        <p>
            <b><u>H<sub>2</sub>O</u></b> is the chemical formula for <del>air</del> <i><ins>water</ins></i>.
        </p>

        <p>
            <b><mark>H2O</mark></b>
        </p>

        <p>
            <strong><mark>E=mc<sup>2</sup></mark></strong> stands for
            <i>Energy, Mass, and speed of light in a vacuum</i>.
        </p>
        </small>
</body>
</html>
