<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 2px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <!-- The Table Structure -->
    <table>
        <thead>
            <tr>
                <th colspan="6">Subject Schedule</th>
            </tr>
            <tr>
                <th rowspan="5">Days</th>
            </tr>
            <tr>
                <th>Time</th>
                <th>Subject</th>
                <th>Room</th>
                <th>Instructor</th>
                <th>Units</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>M,W,F</td>
                <td>10:10-11:30</td>
                <td>SOCSCI 101N</td>
                <td>U706</td>
                <td></td>
                <td>0.3</td>
            </tr>
            <tr>
                <td>M,W,F</td>
                <td>11:30-12:50</td>
                <td>Science 100</td>
                <td>U706</td>
                <td></td>
                <td>0.3</td>
            <tr>
                <td>T,Th</td>
                <td>7:30-8:50</td>
                <td>CIT14</td>
                <td>FLD</td>
                <td>Sir Prim</td>
                <td>3.0</td>
            </tr>
            <tr>
                <td>T,Th,S</td>
                <td>8:50-10:10</td>
                <td>CIT14</td>
                <td>M307</td>
                <td>Sir Prim</td>
                <td>3.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
